name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Pull requests run the tests, the build and the SEO gate; the deploy and
  # IndexNow steps are skipped.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests get their own group so they never cancel a deploy.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'cf-pages' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      # Save the sitemap that is live now, before this run can replace it. The
      # lastmod step carries unchanged pages' dates forward from it, and the
      # IndexNow step diffs against it. Never fails the job.
      - name: Fetch the live sitemap
        run: bun tools/seo/cli.ts fetch-previous

      # The 1,258 OG social cards are ~99% of build time when rendered from
      # scratch: satori lays out an SVG per card and sharp encodes it through
      # mozjpeg, which took 763s of a 782s run before this cache existed. The
      # site's actual HTML builds in about 6 seconds.
      #
      # restore-keys makes this incremental rather than all-or-nothing. Nearly
      # every push changes data/*.json, so the exact key misses, the newest
      # og- cache is restored anyway, and only the cards whose own signature
      # changed get re-rendered. The new cache is then saved under the new key.
      # Cards are also keyed on a fingerprint of the renderers and fonts (see
      # src/lib/og/cache.ts), so restoring an older cache cannot ship a stale
      # design.
      - name: Cache OG images
        uses: actions/cache@v4
        with:
          path: .cache/og
          key: og-${{ hashFiles('data/*.json', 'src/lib/og/**', 'src/assets/fonts/**') }}
          restore-keys: og-

      - name: Build Astro site
        run: bun run build

      # Writes <lastmod> into dist/'s sitemap from each page's content, and
      # dist/sitemap-lastmod.json for the next run. Never fails the job.
      - name: Set sitemap lastmod
        run: bun tools/seo/cli.ts lastmod

      # The SEO gate: every sitemap page has a title, description, canonical
      # and Open Graph tags, titles are unique, every guest and film page is in
      # the sitemap, and no noindex page is. See the SEO section of AGENTS.md.
      - name: Check SEO
        run: bun run test:seo

      - name: Generate Pagefind search index
        run: bunx pagefind --site dist

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match the pinned wrangler devDependency. The action shells out to
          # `bun run wrangler --version` and downloads wrangler itself when the
          # version does not match, which is a fresh tarball fetch on every deploy
          # — that fetch failed mid-extract on 2026-07-24 and broke the deploy.
          # Pinning both means the lockfile install satisfies the check instead.
          wranglerVersion: "3.90.0"
          command: pages deploy dist --project-name=criterion-closet-picks --branch=main

      # Tells Bing, Yandex and the other IndexNow engines which pages this
      # deploy added, changed or removed. Logs a warning on any failure and
      # never fails the deploy.
      - name: Submit changed pages to IndexNow
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        run: bun tools/seo/cli.ts indexnow
